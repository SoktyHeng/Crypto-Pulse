[project]
name = "cryptopulse-backend"
version = "0.1.0"
description = "CryptoPulse AI backend: FastAPI API, workers and offline research tooling."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<2",
  "psycopg[binary]>=3.3,<4",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "httpx2>=2.16,<3",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "DTZ", "RUF", "SIM", "PT", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
# The local `alembic/` migrations folder must not make the `alembic` package first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "integration: requires a PostgreSQL server reachable via TEST_DATABASE_URL",
]
filterwarnings = ["error"]
