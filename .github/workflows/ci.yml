name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: cryptopulse
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: cryptopulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cryptopulse" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      # Integration tests create/drop their own throwaway databases on this server.
      TEST_DATABASE_URL: postgresql+psycopg://cryptopulse:ci_only_password@localhost:5432/postgres
      DATABASE_URL: postgresql+psycopg://cryptopulse:ci_only_password@localhost:5432/cryptopulse
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Migrations apply to the named database
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head

  web:
    name: Web (eslint, tsc, prettier, vitest, build, playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # No API is running here: smoke tests verify pages render honest offline/empty states.
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  compose:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 300
      - name: API health and readiness
        run: |
          curl -fsS http://localhost:8000/api/v1/system/health
          curl -fsS http://localhost:8000/api/v1/system/readiness
      - name: Web serves the app shell
        run: curl -fsS http://localhost:3000/ | grep -q "Market dashboard"
      - run: docker compose run --rm api pytest -q
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
